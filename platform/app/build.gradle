def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// MI CI can select a phone ABI without changing the inherited local defaults.
def miAbis = (findProperty('miAbis') ?: 'arm64-v8a,x86_64').split(',').toList()
if (!miAbis || !miAbis.every { it in ['arm64-v8a', 'x86_64'] }) {
    throw new GradleException('miAbis must contain arm64-v8a and/or x86_64')
}
def miJobs = (findProperty('miJobs') ?: '2').toInteger()
if (miJobs < 1 || miJobs > 16) {
    throw new GradleException('miJobs must be between 1 and 16')
}

def assetNames = ["lang", "mods", "dynos", "palettes"]

android {
    compileSdkVersion 33
    buildToolsVersion "34.0.0"
    ndkVersion "27.0.12077973"
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.maniscat2.sm64coopdx"
        }
        multiDexEnabled false
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 42
        versionName "1.5.1-mi.1"
        ndk {
            moduleName = "app"
            ldLibs "log"
            debugSymbolLevel 'FULL'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "-j${miJobs}", "TOUCH_CONTROLS=1"
                abiFilters(*miAbis)
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
        debug {
            minifyEnabled false
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    tasks.register("copyGameAssets") {
        doLast {
            def dest = file("$projectDir/src/main/assets")
            if (dest.exists()) {
                dest.deleteDir()
            }
            dest.mkdirs()
            assetNames.each { folderName ->
                def src = new File(projectDir.parentFile.parentFile, folderName)
                if (!src.isDirectory()) {
                    throw new GradleException("Missing game asset directory: ${src}")
                }
                copy {
                    from src
                    into new File(dest, folderName)
                }
            }
        }
    }
    preBuild.dependsOn copyGameAssets
    namespace 'com.maniscat2.sm64coopdx'
    lint {
        abortOnError false
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.maniscat2.sm64coopdx.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.jetbrains:annotations:15.0'
}
